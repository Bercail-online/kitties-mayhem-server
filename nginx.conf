worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-cb;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    default_type text/plain;
    map $http_upgrade $conn_upgrade { default upgrade; "" close; }
    server {
        listen __PORT__;
        location / {
            # Plain visits (the Space page, health checks) get a status line; the game's WebSocket goes to Godot.
            if ($http_upgrade = "") { return 200 "Kitties Mayhem server is running. Join it from the game's PLAY ONLINE screen.\n"; }
            proxy_pass http://127.0.0.1:7777;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conn_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
